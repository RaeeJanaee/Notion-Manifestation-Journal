<!DOCTYPE html>
<html>
<head>
  <title>Manifestation Journal with Quote Generator</title>
  <style>
    /* Styles for the manifestation journal and quote generator */
    body {
      background-color: #FFFFFF; /* White background */
      text-align: center; /* Center the quote horizontally */
    }
    .manifestation-journal {
      font-family: serif; /* Serif font */
      color: #f49cc8; /* Color f49cc8 */
      font-size: 24px; /* You can adjust the font size as needed */
      white-space: nowrap; /* Keep the text on one line */
      margin-bottom: 20px; /* Add some margin to separate the title and quote */
      text-align: center; /* Center the title */
    }
    .quote {
      font-family: serif; /* Serif font */
      color: #000000; /* Black text */
      font-style: italic; 
      border: 1px solid #f49cc8; /* #f49cc8 border */
      padding: 20px; /* Add some padding for better readability */
      display: inline-block; /* Make the quote container an inline-block element */
      max-width: fit-content; /* Make the border wrap around the text */
    }
  </style>
</head>
<body>
  <!-- Display the manifestation journal title -->
  <p class="manifestation-journal"><b>Welcome</b></p>

  <!-- Display the random quote -->
  <div class="quote" id="quote"></div>

  <script>
    // Array of quotes
    const quotes = [
     "Do what you love, and you’ll never work a day in your life," — Unknown,

"Success is not final; failure is not fatal: It is the courage to continue that counts," — Winston Churchill,

"Dream big, start small, but most of all, start," — Simon Sinek,

"The way to get started is to quit talking and begin doing," — Walt Disney,

"Entrepreneurship is living a few years of your life like most people won’t, so you can spend the rest of your life like most people can’t," — Unknown,

"Doubt kills more dreams than failure ever will," — Suzy Kassem,

"Hustle until your haters ask if you’re hiring," — Unknown,

"Opportunities don’t happen. You create them," — Chris Grosser,

"Success is built on consistency, not perfection," — Unknown,

"The biggest risk is not taking any risk," — Mark Zuckerberg,

"Work like there is someone working 24 hours a day to take it away from you," — Mark Cuban,

"There is no elevator to success; you have to take the stairs," — Zig Ziglar,

"A goal without a plan is just a wish," — Antoine de Saint-Exupéry,

"It’s not about ideas. It’s about making ideas happen," — Scott Belsky,

"If you don’t build your dream, someone will hire you to help build theirs," — Tony Gaskins,

"A business is simply an idea to make other people’s lives better," — Richard Branson,

"You don’t have to be great to start, but you have to start to be great," — Zig Ziglar,

"Keep going. Your future self will thank you," — Unknown,

"Your business is only as strong as your mindset," — Unknown,

"Don’t wish for it; work for it," — Unknown,

"When you feel like quitting, remember why you started," — Unknown,

"The comeback is always stronger than the setback," — Unknown,

"If plan A doesn’t work, the alphabet has 25 more letters," — Claire Cook,

"Every problem is a gift—without problems, we would not grow," — Tony Robbins,

"Tough times don’t last. Tough people do," — Robert H. Schuller,

"Fall seven times, stand up eight," — Japanese Proverb,

"Fear is temporary. Regret is forever," — Unknown,

"Do not be embarrassed by your failures. Learn from them and start again," — Richard Branson,

"Success is getting up one more time than you fall," — Unknown,

"Obstacles are the cost of greatness," — Robin Sharma,

"Don’t be afraid to charge what you’re worth," — Unknown,

"Money is a tool. It will take you wherever you wish, but it will not replace you as the driver," — Ayn Rand,

"Your business grows when you do," — Unknown,

"Focus on being productive, not busy," — Tim Ferriss,

"Reinvest in your business like you believe in it," — Unknown,

"Chase the vision, not the money; the money will end up following you," — Tony Hsieh,

"Price is what you pay. Value is what you get," — Warren Buffett,

"Never stop learning; your business depends on it," — Unknown,

"Your profit margin is proof of your confidence," — Unknown,

"The more you learn, the more you earn," — Warren Buffett,

"Your brand is what people say about you when you’re not in the room," — Jeff Bezos,

"A satisfied customer is the best business strategy of all," — Michael LeBoeuf,

"Don’t just sell a product, build a brand," — Unknown,

"You are your business’s most valuable asset—show up like it," — Unknown,

"Build something 100 people love, not something 1 million people kind of like," — Brian Chesky,

"People don’t buy what you do; they buy why you do it," — Simon Sinek,

"Word of mouth is the best advertisement money can’t buy," — Unknown,

"Your small business has a big impact—don’t underestimate it," — Unknown,
      // Add more quotes to the array as needed
    ];

    // Function to generate a random quote
    function getRandomQuote() {
      const randomIndex = Math.floor(Math.random() * quotes.length);
      const randomQuote = quotes[randomIndex];
      document.getElementById("quote").innerHTML = randomQuote;
    }

    // Generate a random quote on page load
    getRandomQuote();
  </script>
</body>
</html>
